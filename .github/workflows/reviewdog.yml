name: Review changes (reviewdog)
description: "Review changes of this PR with ruff and mypy"
on: [pull_request]
jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        python-version: 3.14
        enable-cache: true

    - run: uv sync --frozen --all-extras --dev

    - uses: benny123tw/action-ruff@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        reporter: github-pr-check

    - name: Run reviewdog
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv pip install reviewdog
        uv run reviewdog -runners=mypy -reporter=github-pr-check -conf=.reviewdog.yml
