name: Review changes (reviewdog)
description: "Review changes of this PR with ruff and mypy"
on: [pull_request]
jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        python-version: 3.14
        enable-cache: true

    - run: uv sync --frozen --all-extras --dev

    - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0

    - name: Run reviewdog
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run reviewdog -reporter=github-pr-check -runners=mypy,ruff
